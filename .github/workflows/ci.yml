name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  SYSTEM_SPECS_REPO: MiLandry/system-specs
  SYSTEM_SPECS_REF: main

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Resolve system-specs ref
        id: specs-ref
        run: |
          REF="${{ env.SYSTEM_SPECS_REF }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
            if git ls-remote --heads "https://github.com/${{ env.SYSTEM_SPECS_REPO }}.git" "${BRANCH}" | grep -q .; then
              echo "Using system-specs branch: ${BRANCH}"
              REF="${BRANCH}"
            else
              echo "No system-specs branch ${BRANCH}; using ${REF}"
            fi
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"

      - name: Checkout system-specs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SYSTEM_SPECS_REPO }}
          ref: ${{ steps.specs-ref.outputs.ref }}
          path: system-specs

      - name: Link system-specs for codegen path
        run: ln -sfn "$GITHUB_WORKSPACE/system-specs" ../system-specs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
